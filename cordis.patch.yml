# cordis.patch.yml — dsh-algorithm-tools 插件挂载行
#
# 在 dsh profile 的 cordis.patch.yml 中添加此行即可挂载插件。

- insert:
    - id: algo-trainer
      name: 'dsh-algorithm-tools'
      config:
        dataDir: ''
        ai:
          enabled: false
          baseURL: 'https://api.deepseek.com/v1'
          apiKey: ''
          model: 'deepseek-chat'
